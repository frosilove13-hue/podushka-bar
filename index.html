<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Барная энциклопедия Подушки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: «нашивка» — чёрное полотно, кремовые карточки-патчи с оранжевой строчкой; одна колонка под телефон */
:root{
  --bg:#0c0b0a;          /* чёрная ткань логотипа */
  --surface:#171513;
  --surface-2:#211e1b;
  --cream:#ede3d3;       /* кремовый круг */
  --cream-ink:#1a1714;
  --fg:#f1e9dc;
  --muted:#a89e90;
  --line:#3a342e;
  --orange:#ee5a24;      /* строчка и надпись */
  --orange-soft:#ee5a2422;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 5px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;min-height:58px}
.top-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}
.top-title{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;line-height:1.1;min-width:0}
.top-title small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);letter-spacing:0;font-weight:500}
.back{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--orange);display:grid;place-items:center;flex:none;color:var(--orange)}
.back svg{width:18px;height:18px}

/* Главная */
.hero{display:grid;justify-items:center;text-align:center;gap:6px;padding-block:20px 8px}
.hero img{width:min(220px,58vw);border-radius:50%}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.1;margin:8px 0 0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-label::after{content:"";flex:1;border-top:1.5px dashed var(--line)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.patch{position:relative;text-align:left;background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:14px 14px 16px;
  box-shadow:0 0 0 2px var(--cream),0 0 0 4px var(--cream-ink),inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange);
  display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s}
.patch:active{transform:scale(.97)}
.patch .num{font-family:var(--font-display);font-size:13px;color:var(--orange)}
.patch .nm{font-family:var(--font-display);font-size:21px;line-height:1.05}
.patch .en{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6b6157}
.patch .tg{font-size:13px;line-height:1.35;color:#3d362f;margin-top:auto}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qbtn{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:left;display:grid;gap:2px}
.qbtn b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--orange)}
.qbtn span{font-size:13px;color:var(--muted)}

/* Страница напитка */
.sp-head{padding-block:18px 4px}
.sp-head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1;margin:4px 0 6px}
.sp-head p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface);border-radius:12px;padding:10px;min-width:0}
.fact span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600;font-size:14px;line-height:1.25;display:block;margin-top:2px;overflow-wrap:anywhere}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);border-style:solid;color:#fff}

.content{display:grid;gap:14px;padding-top:18px}
.content h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:10px 0 0;color:var(--cream);text-wrap:balance}
.content p{margin:0;max-width:65ch}
.lead{font-size:18px;line-height:1.5;color:var(--cream);font-weight:500}
.note{background:var(--orange-soft);border:1.5px dashed var(--orange);border-radius:14px;padding:12px 14px;font-size:15px}
.note::before{content:"Важно";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
ul.list,ol.olist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list li{position:relative;padding-left:20px}
ul.list li::before{content:"";position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--orange)}
ol.olist{counter-reset:o}
ol.olist li{counter-increment:o;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.olist li::before{content:counter(o);width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--orange);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;color:var(--orange)}

.steps{display:grid;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:42px;bottom:2px;border-left:2px dashed var(--line)}
.steps .n{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--cream-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:inset 0 0 0 2.5px var(--cream),inset 0 0 0 4px var(--orange)}
.steps b{display:block;font-size:16px;margin-top:8px}
.steps p{color:var(--muted);font-size:15px}

.cards{display:grid;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:4px;border:1px solid var(--line)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card b{font-size:17px;color:var(--cream)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.card p{color:var(--muted);font-size:15px}

.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;vertical-align:top}
th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600}
tr+tr td{border-top:1px solid var(--line)}
td:first-child{font-weight:600;color:var(--cream);white-space:nowrap}

.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:14px;padding-bottom:16px;position:relative}
.tl li::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--orange);margin-top:5px;box-shadow:0 0 0 4px var(--orange-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;bottom:0;border-left:2px dashed var(--line)}
.tl b{display:block;font-family:var(--font-display);font-weight:400;color:var(--orange);font-size:15px}
.tl p{color:var(--fg);font-size:15px}

.ck{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange)}
.ck .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck b{font-family:var(--font-display);font-weight:400;font-size:20px}
.ck .base{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.ck p{color:#3d362f;font-size:15px}
.ck ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.ck li{display:flex;gap:8px}
.ck li::before{content:"—";color:var(--orange);font-weight:700}
.ck .how{font-size:14px;color:#5a5047;border-top:1.5px dashed #c9bba5;padding-top:8px}

.quiz{background:var(--surface);border:1.5px dashed var(--orange);border-radius:16px;padding:16px;display:grid;gap:10px}
.quiz .q{font-weight:600;color:var(--cream)}
.quiz button{justify-self:start;background:var(--orange);color:#fff;font-weight:600;padding:9px 16px;border-radius:999px}
.quiz .a{color:var(--fg)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.filters::-webkit-scrollbar{display:none}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px dashed var(--orange);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;margin-top:18px}
.search::placeholder{color:var(--muted)}
.res{display:grid;gap:10px;margin-top:14px}
.hit{background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:4px;border:1px solid var(--line)}
.hit .where{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.hit .snip{font-size:14px;color:var(--muted)}
.hit mark{background:var(--orange-soft);color:var(--cream);border-radius:3px;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;padding:12px;border-radius:14px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.pager button:last-child{text-align:right}
.pager button.go{border-color:var(--orange);color:var(--orange)}

/* Нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px dashed var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--orange)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<header class="top"><div class="top-in" id="topbar"></div></header>
<main class="wrap" id="view"></main>
<nav class="nav" aria-label="Разделы"><div class="nav-in">

  <button id="nav-cocktails" data-go="cocktails"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-8 9Z"/><path d="M12 13v7M8 20h8M16 4l3-2"/></svg>Коктейли</button>
  <button id="nav-search" data-go="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Поиск</button>
</div></nav>

<script>// Данные энциклопедии. Чтобы добавить или поправить текст, меняйте только этот файл.
// Типы блоков: p, lead, note, list, olist, steps, cards, table, quiz, cocktails
window.SPIRITS = [
{
  id: "gin", num: "01", name: "Джин", en: "Gin",
  tagline: "От голландского женевера до классики коктейлей",
  facts: [["Мин. крепость", "37,5%"], ["Корни", "Нидерланды"], ["Главное", "Можжевельник"]],
  sections: [
    { id: "basics", title: "Основы", blocks: [
      { type: "lead", text: "Джин — крепкий алкогольный напиток, основным ароматическим компонентом которого является можжевельник. Именно он отличает джин от большинства других крепких напитков." },
      { type: "p", text: "Внешне джин обычно прозрачен, но его аромат может быть совершенно разным: от выраженного хвойного и сухого до цитрусового, цветочного, пряного или даже землистого." },
      { type: "p", text: "Согласно регламенту ЕС № 2019/787, минимальная крепость джина — 37,5% об. На практике встречаются продукты 40%, 43%, 47% и выше. Конкретная крепость зависит от продукта и рынка." },
      { type: "note", text: "Джин — это не просто водка, в которую добавили можжевельник. У него есть собственные правила производства, ароматический профиль и несколько технологических категорий." },
      { type: "h", text: "Родина джина" },
      { type: "p", text: "Современный джин чаще всего связывают с Англией. Но истоки напитка — в Нидерландах и Бельгии." },
      { type: "p", text: "Предшественник джина — женевер (jenever / genever). Это традиционный можжевеловый напиток, тесно связанный с зерновыми дистиллятами, с гораздо более выраженным солодовым вкусом, чем современный London Dry Gin." },
      { type: "note", text: "Корректно говорить так: корни джина — в Нидерландах и соседних регионах, а Англия превратила его в самостоятельный и всемирно известный стиль." }
    ]},
    { id: "history", title: "История", blocks: [
      { type: "timeline", items: [
        ["Средние века", "Можжевельник используют в лечебных средствах, в Европе развивается перегонка спирта. Ранние можжевеловые напитки — ещё не джин, но часть традиции, из которой вырос женевер."],
        ["XVII век", "Женевер популярен в Нидерландах. Торговые связи голландцев и англичан приносят напиток в Англию."],
        ["1688", "Вильгельм Оранский становится английским королём. На фоне противостояния с Францией политика поощряет местные спиртные напитки, в том числе джин, вместо французского бренди."],
        ["Первая половина XVIII века", "Gin Craze — массовое распространение дешёвого джина в Англии, особенно в Лондоне. Причины: налоги, доступное зерно, ограничения на импорт бренди, слабый контроль."],
        ["1751", "Уильям Хогарт создаёт гравюру Gin Lane о последствиях пьянства. Закон 1751 года становится одной из ключевых мер борьбы с кризисом."],
        ["XIX–XX века", "Дистилляция улучшается, формируются узнаваемые стили, а с распространением коктейлей джин получает вторую жизнь."]
      ]},
      { type: "note", text: "Легенда: англичане «открыли» джин в Тридцатилетнюю войну, увидев бесстрашных голландских солдат. Надёжных оснований для этого нет — популярный рассказ, а не доказанный факт." },
      { type: "p", text: "Сегодня джин используется и в классике, и в современных авторских напитках." }
    ]},
    { id: "production", title: "Производство", blocks: [
      { type: "p", text: "Несмотря на огромное разнообразие брендов, базовая логика производства довольно понятна." },
      { type: "steps", items: [
        ["Подготовка спиртовой основы", "Используют этиловый спирт сельскохозяйственного происхождения: из пшеницы, ржи, ячменя, кукурузы и других культур."],
        ["Подготовка ботаникалов", "Главный компонент — ягоды можжевельника. Также кориандр, корень дягиля, кардамон, корица, ирисовый корень, цитрусовая цедра. Набор зависит от рецептуры."],
        ["Извлечение аромата", "Ботаникалы настаивают в спирте, перегоняют вместе с ним или кладут в корзину, через которую проходят спиртовые пары, — так аромат извлекается без погружения в жидкость."],
        ["Дистилляция", "Смесь нагревают, летучие ароматические соединения уходят в пар вместе со спиртом, затем конденсируются. Мастер-дистиллер контролирует профиль."],
        ["Крепость и розлив", "Продукт разбавляют водой до нужной крепости, иногда дают отдохнуть, фильтруют и разливают."]
      ]},
      { type: "note", text: "Простой способ — ароматизировать нейтральный спирт готовыми препаратами. В ЕС это может быть категория Gin, но не Distilled Gin." },
      { type: "h", text: "Что дают ботаникалы" },
      { type: "table", head: ["Компонент", "Вклад в аромат"], rows: [
        ["Можжевельник", "Хвоя, смола, сухие древесные ноты"],
        ["Кориандр", "Цитрусовые, пряные, слегка перечные ноты"],
        ["Цедра лимона", "Свежесть, яркий цитрус"],
        ["Цедра апельсина", "Более округлый, сладковатый цитрус"],
        ["Корень дягиля", "Землистые, сухие, корневые оттенки"],
        ["Кардамон", "Тёплые пряные, иногда эвкалиптовые оттенки"],
        ["Ирисовый корень", "Фиксация и поддержка аромата"]
      ]},
      { type: "p", text: "Это ориентиры, а не формула: вкус зависит от количества сырья, экстракции, дистилляции и сочетания компонентов. Выраженно можжевеловый джин держит структуру сухого Martini, а цитрусовый и мягкий хорошо раскрывается в Gin & Tonic." }
    ]},
    { id: "types", title: "Виды", blocks: [
      { type: "h", text: "Юридические категории ЕС" },
      { type: "cards", items: [

const S = window.SPIRITS;
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0c0b0a"); tg.setBackgroundColor("#0c0b0a"); } catch(e){} }
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch(e){} };

const $view = document.getElementById("view"), $top = document.getElementById("topbar");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => S.find(s => s.id === id);

function block(b){
  switch(b.type){
    case "lead": return `<p class="lead">${esc(b.text)}</p>`;
    case "p": return `<p>${esc(b.text)}</p>`;
    case "h": return `<h2>${esc(b.text)}</h2>`;
    case "note": return `<div class="note">${esc(b.text)}</div>`;
    case "list": return `<ul class="list">${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    case "olist": return `<ol class="olist">${b.items.map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ol>`;
    case "steps": return `<ol class="steps">${b.items.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join("")}</ol>`;
    case "timeline": return `<ol class="tl">${b.items.map(s=>`<li><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join("")}</ol>`;
    case "cards": return `<div class="cards">${b.items.map(c=>`<div class="card"><div class="ch"><b>${esc(c[0])}</b><span class="chip">${esc(c[1])}</span></div><p>${esc(c[2])}</p></div>`).join("")}</div>`;
    case "table": return `<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "cocktails": return `<div class="cards">${b.items.map(c=>cocktail(c)).join("")}</div>`;
    case "quiz": return `<div class="quiz"><span class="eyebrow">Вопрос аудитории</span><div class="q">${esc(b.q)}</div><button type="button" data-reveal>Показать ответ</button><div class="a" hidden>${esc(b.a)}</div></div>`;
  }
  return "";
}
function cocktail(c, base){
  return `<article class="ck"><div class="ch"><b>${esc(c[0])}</b>${base?`<span class="base">${esc(base)}</span>`:""}</div><p>${esc(c[1])}</p>${c[2]?`<ul>${c[2].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}${c[3]?`<div class="how">${esc(c[3])}</div>`:""}</article>`;
}

const back = `<button class="back" type="button" data-back aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;
function topbar(title, sub, withBack){
  $top.innerHTML = (withBack ? back : `<img class="top-logo" src="${LOGO}" alt="">`) +
    `<div class="top-title">${esc(title)}<small>${esc(sub)}</small></div>`;
  if (tg) { try { withBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
}
function setNav(id){ document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); }); }

function home(){
  topbar("Подушка", "Барная энциклопедия", false); setNav("home");
  $view.innerHTML = `
  <section class="hero"><img src="${LOGO}" alt="Логотип кафе «Подушка»"><span class="eyebrow">Обучение барменов</span>
    <h1>Энциклопедия крепкого алкоголя</h1><p>Шесть категорий: история, производство, классификации, дегустация и классические коктейли.</p></section>
  <div class="sec-label eyebrow">Напитки</div>
  <div class="grid">${S.map(s=>`<button class="patch" type="button" data-spirit="${s.id}"><span class="num">№ ${s.num}</span><span class="nm">${esc(s.name)}</span><span class="en">${esc(s.en)}</span><span class="tg">${esc(s.tagline)}</span></button>`).join("")}</div>
  <div class="quick">
    <button class="qbtn" type="button" data-go="cocktails"><b>Коктейли</b><span>Вся классика из докладов</span></button>
    <button class="qbtn" type="button" data-go="search"><b>Поиск</b><span>По всем разделам</span></button>
  </div>`;
}

function spirit(id, sec){
  const s = byId(id); if(!s) return home();
  const idx = Math.max(0, s.sections.findIndex(x=>x.id===sec));
  const cur = s.sections[idx];
  topbar(s.name, `№ ${s.num} · ${cur.title}`, true); setNav("home");
  const prev = s.sections[idx-1], next = s.sections[idx+1];
  $view.innerHTML = `
  <section class="sp-head"><span class="eyebrow">${esc(s.en)}</span><h1>${esc(s.name)}</h1><p>${esc(s.tagline)}</p>
    <div class="facts">${s.facts.map(f=>`<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join("")}</div></section>
  <div class="tabs" role="tablist">${s.sections.map(x=>`<button class="tab" role="tab" type="button" aria-selected="${x.id===cur.id}" data-spirit="${s.id}" data-sec="${x.id}">${esc(x.title)}</button>`).join("")}</div>
  <section class="content">${cur.blocks.map(block).join("")}</section>
  <div class="pager">
    ${prev?`<button type="button" data-spirit="${s.id}" data-sec="${prev.id}">← ${esc(prev.title)}</button>`:"<span></span>"}
    ${next?`<button type="button" class="go" data-spirit="${s.id}" data-sec="${next.id}">${esc(next.title)} →</button>`:"<span></span>"}
  </div>`;
  const t = $view.querySelector('.tab[aria-selected="true"]'); t && t.scrollIntoView({inline:"center",block:"nearest"});
}

function allCocktails(){
  const out=[]; S.forEach(s=>s.sections.forEach(sec=>sec.blocks.forEach(b=>{ if(b.type==="cocktails") b.items.forEach(c=>out.push({s,c})); }))); return out;
}
let ckFilter = "all";
function cocktails(){
  topbar("Коктейли", "Классика из всех докладов", false); setNav("cocktails");
  const list = allCocktails().filter(x=>ckFilter==="all"||x.s.id===ckFilter);
  $view.innerHTML = `<div class="sp-head"><span class="eyebrow">Барная карта</span><h1>Коктейли</h1><p>${allCocktails().length} классических рецептов по базовому спирту.</p></div>
  <div class="filters">${[["all","Все"],...S.map(s=>[s.id,s.name])].map(f=>`<button class="tab" type="button" data-ck="${f[0]}" aria-selected="${ckFilter===f[0]}">${esc(f[1])}</button>`).join("")}</div>
  <div class="cards">${list.map(x=>cocktail(x.c, x.s.name)).join("")}</div>`;
}

// Поиск
const index=[];
S.forEach(s=>s.sections.forEach(sec=>sec.blocks.forEach(b=>{
  const parts=[]; if(b.text)parts.push(b.text); if(b.q)parts.push(b.q,b.a);
  if(b.items)b.items.forEach(i=>parts.push(Array.isArray(i)?i.flat().join(" — "):i));
  if(b.rows)b.rows.forEach(r=>parts.push(r.join(" — ")));
  parts.forEach(t=>index.push({s,sec,t}));
})));
let query="";
function snippet(t,q){
  const i=t.toLowerCase().indexOf(q); const a=Math.max(0,i-50); const piece=(a?"…":"")+t.slice(a,i+q.length+90)+(i+q.length+90<t.length?"…":"");
  const j=piece.toLowerCase().indexOf(q); return esc(piece.slice(0,j))+"<mark>"+esc(piece.slice(j,j+q.length))+"</mark>"+esc(piece.slice(j+q.length));
}
function renderResults(){
  const q=query.trim().toLowerCase(); const box=document.getElementById("res"); if(!box)return;
  if(q.length<2){ box.innerHTML=`<p class="empty">Например: «solera», «агава», «Negroni», «торф»</p>`; return; }
  const hits=index.filter(x=>x.t.toLowerCase().includes(q)).slice(0,40);
  box.innerHTML = hits.length ? hits.map(h=>`<button class="hit" type="button" data-spirit="${h.s.id}" data-sec="${h.sec.id}"><span class="where">${esc(h.s.name)} · ${esc(h.sec.title)}</span><span class="snip">${snippet(h.t,q)}</span></button>`).join("")
    : `<p class="empty">Ничего не нашлось по запросу «${esc(query)}». Попробуйте другое слово.</p>`;
}
function search(){
  topbar("Поиск", "По всей энциклопедии", false); setNav("search");
  $view.innerHTML = `<label for="q" class="eyebrow" style="display:block;margin-top:18px">Что ищем?</label><input id="q" class="search" type="search" placeholder="Термин, коктейль, страна…" autocomplete="off" value="${esc(query)}"><div class="res" id="res"></div>`;
  const inp=document.getElementById("q"); inp.addEventListener("input",()=>{query=inp.value;renderResults();}); renderResults();
}

// Навигация через hash, чтобы работала кнопка «Назад» Telegram
function route(){
  const [a,b,c]=location.hash.replace(/^#/,"").split("-");
  if(a==="s") spirit(b,c); else if(a==="cocktails") cocktails(); else if(a==="search") search(); else home();
  window.scrollTo(0,0);
}
function go(h){ haptic(); if(location.hash==="#"+h) route(); else location.hash=h; }
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el)return;
  if(el.dataset.reveal!==undefined){ el.nextElementSibling.hidden=false; el.hidden=true; haptic(); return; }
  if(el.dataset.back!==undefined){ goBack(); return; }
  if(el.dataset.ck){ ckFilter=el.dataset.ck; haptic(); cocktails(); return; }
  if(el.dataset.spirit){ go("s-"+el.dataset.spirit+(el.dataset.sec?"-"+el.dataset.sec:"")); return; }
  if(el.dataset.go){ go(el.dataset.go==="home"?"":el.dataset.go); }
});
function goBack(){ haptic(); if(history.length>1) history.back(); else location.hash=""; }
if(tg){ try{ tg.BackButton.onClick(goBack); }catch(e){} }
route();
})();
</script>
