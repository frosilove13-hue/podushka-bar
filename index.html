<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Барная энциклопедия Подушки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: «нашивка» — чёрное полотно, кремовые карточки-патчи с оранжевой строчкой; одна колонка под телефон */
:root{
  --bg:#0c0b0a;          /* чёрная ткань логотипа */
  --surface:#171513;
  --surface-2:#211e1b;
  --cream:#ede3d3;       /* кремовый круг */
  --cream-ink:#1a1714;
  --fg:#f1e9dc;
  --muted:#a89e90;
  --line:#3a342e;
  --orange:#ee5a24;      /* строчка и надпись */
  --orange-soft:#ee5a2422;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}


body{overflow-x:clip;margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 5px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:58px}
.top-word{height:clamp(28px,8.5vw,36px);width:auto;flex:none;display:block}
.top-title.top-sub{flex:1 1 auto;min-width:0;text-align:right;font-family:var(--font-body);font-size:clamp(10px,2.9vw,12px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;line-height:1.1;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-title small{overflow:hidden;text-overflow:ellipsis}
.top-title small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);letter-spacing:0;font-weight:500}
.back{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--orange);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--orange)}
.back svg{width:18px;height:18px;display:block;flex:none}

/* Главная */
.hero{display:grid;justify-items:center;text-align:center;gap:6px;padding-block:20px 8px}
.hero-cat{width:min(240px,62vw);transform:rotate(-4deg);filter:drop-shadow(0 10px 18px #0009);transition:transform .3s}
.hero-cat:hover{transform:rotate(0deg) scale(1.02)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.1;margin:8px 0 0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-label::after{content:"";flex:1;border-top:1.5px dashed var(--line)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.patch{position:relative;text-align:left;background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:14px 14px 16px;
  box-shadow:0 0 0 2px var(--cream),0 0 0 4px var(--cream-ink),inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange);
  display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0;transition:transform .15s}
.patch:active{transform:scale(.97)}
.grid .patch:last-child:nth-child(odd){grid-column:span 2;min-height:120px}
.patch .num{font-family:var(--font-display);font-size:13px;color:var(--orange)}
.patch .nm{font-family:var(--font-display);font-size:clamp(17px,5.4vw,21px);line-height:1.05;overflow-wrap:anywhere;hyphens:auto}
.patch .en{overflow-wrap:anywhere;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6b6157}
.patch .tg{font-size:13px;line-height:1.35;color:#3d362f;margin-top:auto}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.qbtn{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.qbtn b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--orange)}
.qbtn span{font-size:13px;color:var(--muted)}

/* Страница напитка */
.sp-head{padding-block:18px 4px}
.sp-head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,9vw,42px);line-height:1.05;margin:4px 0 6px;overflow-wrap:anywhere;text-wrap:balance}
.sp-head p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:var(--surface);border-radius:12px;padding:10px;min-width:0}
.fact span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600;font-size:14px;line-height:1.25;display:block;margin-top:2px;overflow-wrap:anywhere}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);border-style:solid;color:#fff}

.content{display:grid;gap:14px;padding-top:18px}
.content h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:10px 0 0;color:var(--cream);text-wrap:balance}
.content p{margin:0;max-width:65ch}
.lead{font-size:18px;line-height:1.5;color:var(--cream);font-weight:500}
.note{background:var(--orange-soft);border:1.5px dashed var(--orange);border-radius:14px;padding:12px 14px;font-size:15px}
.note::before{content:"Важно";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
ul.list,ol.olist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.list li{position:relative;padding-left:20px}
ul.list li::before{content:"";position:absolute;left:3px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--orange)}
ol.olist{counter-reset:o}
ol.olist li{counter-increment:o;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.olist li::before{content:counter(o);width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--orange);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;color:var(--orange)}

.steps{display:grid;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:42px;bottom:2px;border-left:2px dashed var(--line)}
.steps .n{width:40px;height:40px;border-radius:50%;background:var(--cream);color:var(--cream-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:inset 0 0 0 2.5px var(--cream),inset 0 0 0 4px var(--orange)}
.steps b{display:block;font-size:16px;margin-top:8px}
.steps p{color:var(--muted);font-size:15px}

.cards{display:grid;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:4px;border:1px solid var(--line)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card b{font-size:17px;color:var(--cream)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.card p{color:var(--muted);font-size:15px}

.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;vertical-align:top}
th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:600}
tr+tr td{border-top:1px solid var(--line)}
td:first-child{font-weight:600;color:var(--cream);min-width:7.5em}

.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:14px;padding-bottom:16px;position:relative}
.tl li::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--orange);margin-top:5px;box-shadow:0 0 0 4px var(--orange-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;bottom:0;border-left:2px dashed var(--line)}
.tl b{display:block;font-family:var(--font-display);font-weight:400;color:var(--orange);font-size:15px}
.tl p{color:var(--fg);font-size:15px}

.ck{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange)}
.ck .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck b{font-family:var(--font-display);font-weight:400;font-size:20px}
.ck .base{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.ck p{color:#3d362f;font-size:15px}
.ck ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.ck li{display:flex;gap:8px}
.ck li::before{content:"—";color:var(--orange);font-weight:700}
.ck .how{font-size:14px;color:#5a5047;border-top:1.5px dashed #c9bba5;padding-top:8px}

.quiz{background:var(--surface);border:1.5px dashed var(--orange);border-radius:16px;padding:16px;display:grid;gap:10px}
.quiz .q{font-weight:600;color:var(--cream)}
.quiz button{justify-self:start;background:var(--orange);color:#fff;font-weight:600;padding:9px 16px;border-radius:999px}
.quiz .a{color:var(--fg)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.filters::-webkit-scrollbar{display:none}

.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px dashed var(--orange);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;margin-top:18px}
.search::placeholder{color:var(--muted)}
.res{display:grid;gap:10px;margin-top:14px}
.hit{background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1px solid var(--line)}
.hit .where{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.hit .snip{font-size:14px;color:var(--muted)}
.hit b{color:var(--cream);font-size:16px}
.hit mark{background:var(--orange-soft);color:var(--cream);border-radius:3px;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{flex:1;padding:12px;border-radius:14px;border:1.5px dashed var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.pager button:last-child{text-align:right}
.pager button.go{border-color:var(--orange);color:var(--orange)}

/* Нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px dashed var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:clamp(10px,2.85vw,12px);font-weight:600;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button svg{width:22px;height:22px;display:block;flex:none}
.nav button[aria-current="page"]{color:var(--orange)}
/* Выбор примера: аперитив / дижестив */
:root{--ap:#7fc4a0;--dg:#c99bd8}
.picker{display:grid;gap:12px}
.pk-legend{display:flex;gap:6px;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.role.ap{background:#7fc4a022;color:var(--ap)}
.role.dg{background:#c99bd822;color:var(--dg)}
.role.both{background:var(--orange-soft);color:var(--orange)}
.pk-chips{display:flex;flex-wrap:wrap;gap:8px}
.pk{padding:8px 13px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.pk.role-ap{border-left:4px solid var(--ap)}
.pk.role-dg{border-left:4px solid var(--dg)}
.pk.role-both{border-left:4px solid var(--orange)}
.pk[aria-pressed="true"]{background:var(--cream);color:var(--cream-ink);border-color:var(--cream)}
.pk-card{background:var(--cream);color:var(--cream-ink);border-radius:18px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 4.5px var(--orange)}
.pk-card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk-card b{font-family:var(--font-display);font-weight:400;font-size:22px}
.pk-card p{color:#3d362f;margin:0}
.pk-card .role.ap{background:#2e7a52;color:#fff}.pk-card .role.dg{background:#7a4a8c;color:#fff}.pk-card .role.both{background:var(--orange);color:#fff}
.inbar{font-size:14px;color:#3d362f;border-top:1.5px dashed #c9bba5;padding-top:8px}
.inbar span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}

/* Меню бара */
.menu-cta{width:100%;text-align:left;background:var(--orange);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;align-items:stretch;gap:2px;
  box-shadow:inset 0 0 0 3px var(--orange),inset 0 0 0 4.5px #fff8;transition:transform .15s}
.menu-cta:active{transform:scale(.98)}
.menu-cta b{font-family:var(--font-display);font-weight:400;font-size:22px}
.menu-cta span{font-size:14px;opacity:.9}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.jump button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.grp{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px);display:grid;gap:10px;margin-top:22px}
.grp h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0;color:var(--cream);display:flex;align-items:baseline;gap:10px}
.grp h2 small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
.item[open]{border-color:var(--orange);border-style:dashed}
.item summary{list-style:none;cursor:pointer;padding:13px 14px;display:grid;gap:5px}
.item summary::-webkit-details-marker{display:none}
.it-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.it-top b{font-size:17px;color:var(--cream);line-height:1.25;min-width:0;overflow-wrap:anywhere}
.abv{flex:none;font-family:var(--font-display);font-size:14px;color:var(--orange);font-variant-numeric:tabular-nums}
.alt,.maker{font-size:13px;color:var(--muted);line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tags span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--orange-soft);color:var(--orange)}
.more{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item[open] .more{color:var(--orange)}
.it-body{padding:0 14px 14px;display:grid;gap:12px;border-top:1.5px dashed var(--line);padding-top:12px;margin:0 0 0}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.spec{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.spec span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.fld span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
.fld p{margin:0;font-size:15px;white-space:pre-line;max-width:65ch}
/* Фото */
.ph{margin:0;display:grid;gap:6px}
.ph img{width:100%;border-radius:14px;display:block;max-height:440px;object-fit:cover;background:var(--surface)}
.ph figcaption{font-size:13px;color:var(--muted)}
.pt-cover{width:100%;height:84px;object-fit:cover;border-radius:10px;display:block}
.sp-cover{width:100%;max-height:230px;object-fit:cover;border-radius:16px;margin-top:14px;display:block}
.it-row{display:flex;gap:12px;align-items:flex-start}
.it-main{display:grid;gap:5px;flex:1;min-width:0}
.it-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.it-img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;display:block}
.grid > :last-child:nth-child(odd){grid-column:span 2}
.grid > .patch:last-child:nth-child(odd){min-height:120px}

/* Режим администратора */
.top-gear{margin-left:0;width:36px;height:36px;border-radius:50%;border:1.5px dashed #5a524a;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.top-gear svg{width:18px;height:18px;display:block;flex:none}
body.admin .top-gear{border-color:var(--orange);color:var(--orange)}
.abar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:26;background:var(--orange);color:#fff}
.abar-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:8px}
.abar .ab-t{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.25}
.abar button{background:#fff;color:#b8400f;font-weight:700;font-size:14px;padding:8px 13px;border-radius:999px;flex:none}
.abar button.ghost{background:transparent;color:#fff;border:1.5px solid #ffffffaa}
.abar button:disabled{opacity:.55}
body.admin .wrap{padding-bottom:160px}
.ablk{border:1.5px dashed #ee5a2466;border-radius:14px;padding:8px 10px 12px;display:grid;gap:8px}
.atools,.astrip,.add-row{display:flex;gap:6px;flex-wrap:wrap}
.atools{justify-content:flex-end}
.atools button,.astrip button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.atools .kind{margin-right:auto;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);align-self:center}
.astrip{margin-top:12px}
.add-row button{font-size:14px;font-weight:700;padding:10px 14px;border-radius:999px;border:1.5px dashed var(--orange);color:var(--orange)}
.pw{position:relative;display:grid}

// Перед первой правкой ТТК, заготовок или словаря берём копию встроенных данных в content.json
function own(k){ if(!DB[k]) DB[k] = JSON.parse(JSON.stringify(k==="ttk" ? TT() : k==="preps" ? PR() : GL())); return DB[k]; }
const GL = () => DB.glossary || window.GLOSSARY || [];
// Разделы калькулятора: свой порядок (может быть и пустой раздел) + разделы, найденные у заготовок
const PCATS = () => { const o = (DB.prepCats || []).slice(); PR().forEach(p => { if(p.cat && !o.includes(p.cat)) o.push(p.cat); }); return o; };
function setDB(d){
  DB = { spirits: d.spirits || [], menu: d.menu || [], admins: d.admins || [], glossary: d.glossary, ttk: d.ttk, preps: d.preps, prepCats: d.prepCats };
  S = DB.spirits; M = DB.menu; buildIndex();
}

/* ---------- Telegram ---------- */

const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16Z"/></svg>`;

function toast(msg, ms){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2800);
}

/* ---------- Блоки контента ---------- */
function block(b){
  switch(b.type){
    case "lead": return `<p class="lead">${esc(b.text)}</p>`;
    case "p": return `<p>${esc(b.text)}</p>`;
    case "h": return `<h2>${esc(b.text)}</h2>`;
    case "note": return `<div class="note">${esc(b.text)}</div>`;
    case "list": return `<ul class="list">${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    case "olist": return `<ol class="olist">${b.items.map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ol>`;
    case "steps": return `<ol class="steps">${b.items.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join("")}</ol>`;
    case "timeline": return `<ol class="tl">${b.items.map(s=>`<li><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join("")}</ol>`;
    case "cards": return `<div class="cards">${b.items.map(c=>`<div class="card"><div class="ch"><b>${esc(c[0])}</b>${c[1]?`<span class="chip">${esc(c[1])}</span>`:""}</div><p>${esc(c[2])}</p></div>`).join("")}</div>`;
    case "table": return `<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "cocktails": return `<div class="cards">${b.items.map(c=>cocktail(c)).join("")}</div>`;
    case "quiz": return `<div class="quiz"><span class="eyebrow">Вопрос</span><div class="q">${esc(b.q)}</div><button type="button" data-reveal>Показать ответ</button><div class="a" hidden>${esc(b.a)}</div></div>`;
    case "photo": return b.src ? `<figure class="ph"><img src="${esc(src(b.src))}" alt="${esc(b.caption||"")}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>` : "";
    case "picker": return `<div class="picker">
      <div class="pk-legend"><span class="role ap">Аперитив</span><span class="role dg">Дижестив</span><span class="role both">Обе роли</span></div>
      <div class="pk-chips">${b.items.map((x,i)=>`<button type="button" class="pk role-${esc(x[1])}" data-pick="${i}" aria-pressed="${i===0}">${esc(x[0])}</button>`).join("")}</div>
      ${b.items.map((x,i)=>`<div class="pk-card" data-card="${i}" ${i?"hidden":""}><div class="ch"><b>${esc(x[0])}</b><span class="role ${esc(x[1])}">${({ap:"Чаще аперитив",dg:"Чаще дижестив",both:"Обе роли"})[x[1]]||""}</span></div><p>${esc(x[2])}</p>${x[3]?`<div class="inbar"><span>В нашем баре</span>${esc(x[3])}</div>`:""}</div>`).join("")}
    </div>`;
  }
  return "";
}
function cocktail(c, base){
  return `<article class="ck"><div class="ch"><b>${esc(c[0])}</b>${base?`<span class="base">${esc(base)}</span>`:""}</div><p>${esc(c[1])}</p>${c[2]&&c[2].length?`<ul>${c[2].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:""}${c[3]?`<div class="how">${esc(c[3])}</div>`:""}</article>`;
}

/* ---------- Шапка и навигация ---------- */
const back = `<button class="back" type="button" data-back aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;
function gearBtn(){ return showGear() ? `<button class="top-gear" type="button" data-act="gear" aria-label="Редактирование">${ICON_GEAR}</button>` : ""; }
function topbar(title, sub, withBack){
  $top.innerHTML = (withBack
    ? back + `<div class="top-title">${esc(title)}<small>${esc(sub)}</small></div>` + (showGear() ? `<span style="margin-left:auto"></span>${gearBtn()}` : "")
    : `<img class="top-word" src="${WORD}" alt="Подушка" data-word><div class="top-title top-sub">${esc(sub)}</div>${gearBtn()}`);
  if (tg) { try { withBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
}
function setNav(id){ document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.go===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); }); }

/* ---------- Главная ---------- */
const menuCount = () => M.reduce((n,s)=>n+s.groups.reduce((k,g)=>k+g.items.length,0),0);
function home(){
  topbar("Подушка", "Барная энциклопедия", false); setNav("home");
  $view.innerHTML = `
  <section class="hero"><img class="hero-cat" src="${CAT}" alt="Кот «Подушки» в шапке и худи"><span class="eyebrow">Обучение барменов</span>
    <h1>Энциклопедия бармена</h1><p>История, производство, классификации, дегустация и классические коктейли.</p></section>
  <div class="sec-label eyebrow">Наш бар</div>
  <button class="menu-cta" type="button" data-go="menu"><b>Меню бара</b><span>${menuCount()} позиций: ${M.map(m=>m.title.toLowerCase()).join(", ")}</span></button>
  <div class="quick"><button class="qbtn" type="button" data-go="ttk"><b>ТТК</b><span>${TT().reduce((n,s)=>n+s.groups.reduce((k,g)=>k+g.items.length,0),0)} техкарт напитков</span></button><button class="qbtn" type="button" data-go="calc"><b>Заготовки</b><span>Калькулятор: ${PR().length} рецептов</span></button></div>
  <div class="sec-label eyebrow">Энциклопедия</div>
  <div class="grid">${S.map((s,i)=>patch(s,i)).join("")}${A.on?`<button class="patch add" type="button" data-act="addSpirit">＋ Новый раздел</button>`:""}</div>
  <div class="quick">
    <button class="qbtn" type="button" data-go="cocktails"><b>Классика</b><span>Коктейли из докладов</span></button>
    <button class="qbtn" type="button" data-go="dict"><b>Словарь</b><span>${GL().length} барных терминов</span></button>
  </div>
  <p class="ver">Версия приложения: ${APP_VERSION}</p>`;

function patch(s, i){
  const p = `<button class="patch" type="button" data-spirit="${esc(s.id)}">${s.cover?`<img class="pt-cover" src="${esc(src(s.cover))}" alt="" loading="lazy">`:""}<span class="num">№ ${String(i+1).padStart(2,"0")}</span><span class="nm">${esc(s.name)}</span>${s.en?`<span class="en">${esc(s.en)}</span>`:""}<span class="tg">${esc(s.tagline||"")}</span></button>`;
  return A.on ? `<div class="pw">${p}<button class="aedit" type="button" data-act="editSpirit" data-a="${esc(s.id)}" aria-label="Изменить «${esc(s.name)}»">${ICON_EDIT}</button></div>` : p;
}


/* ---------- Страница раздела энциклопедии ---------- */
let ctx = {};
function spirit(id, sec){
  const s = byId(id); if(!s) return home();
  s.sections = s.sections || [];
  const idx = Math.max(0, s.sections.findIndex(x=>x.id===sec));
  const cur = s.sections[idx];
  ctx = { s, cur };
  topbar(s.name, cur ? cur.title : "Пусто", true); setNav("home");
  const prev = s.sections[idx-1], next = s.sections[idx+1];
  const facts = (s.facts||[]).filter(f=>f[0]||f[1]);
  $view.innerHTML = `
  <section class="sp-head">${s.en?`<span class="eyebrow">${esc(s.en)}</span>`:""}<h1>${esc(s.name)}</h1>${s.tagline?`<p>${esc(s.tagline)}</p>`:""}
    ${s.cover?`<img class="sp-cover" src="${esc(src(s.cover))}" alt="">`:""}
    ${facts.length?`<div class="facts">${facts.map(f=>`<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join("")}</div>`:""}</section>
  <div class="tabs" role="tablist">${s.sections.map(x=>`<button class="tab" role="tab" type="button" aria-selected="${x===cur}" data-spirit="${esc(s.id)}" data-sec="${esc(x.id)}">${esc(x.title)}</button>`).join("")}${A.on?`<button class="tab tab-add" type="button" data-act="addSection">＋ Вкладка</button>`:""}</div>
  ${A.on && cur ? `<div class="astrip"><button type="button" data-act="renameSection">Переименовать вкладку</button><button type="button" data-act="moveSection" data-a="-1">← Влево</button><button type="button" data-act="moveSection" data-a="1">Вправо →</button><button type="button" data-act="deleteSection">Удалить вкладку</button></div>` : ""}
  <section class="content">${cur ? cur.blocks.map((b,i)=>A.on?adminBlock(b,i):block(b)).join("") : `<p class="empty">В этом разделе пока нет вкладок.${A.on?" Нажмите «＋ Вкладка».":""}</p>`}
    ${A.on && cur ? `<div class="add-row"><button type="button" data-act="addBlock">＋ Текст или таблица</button><button type="button" data-act="addPhoto">＋ Фото</button></div>` : ""}
  </section>
  ${cur ? `<div class="pager">
    ${prev?`<button type="button" data-spirit="${esc(s.id)}" data-sec="${esc(prev.id)}">← ${esc(prev.title)}</button>`:"<span></span>"}
    ${next?`<button type="button" class="go" data-spirit="${esc(s.id)}" data-sec="${esc(next.id)}">${esc(next.title)} →</button>`:"<span></span>"}
  </div>` : ""}`;
  const t = $view.querySelector('.tab[aria-selected="true"]'); t && t.scrollIntoView({inline:"center",block:"nearest"});
}
function adminBlock(b, i){
  const kind = (BT.find(t=>t[0]===b.type)||[0,"Блок"])[1];
  return `<div class="ablk"><div class="atools"><span class="kind">${esc(kind)}</span><button type="button" data-act="editBlock" data-a="${i}">Изменить</button><button type="button" data-act="moveBlock" data-a="${i}" data-b="-1" aria-label="Выше">↑</button><button type="button" data-act="moveBlock" data-a="${i}" data-b="1" aria-label="Ниже">↓</button></div>${block(b) || `<p class="hint">Пустой блок</p>`}</div>`;
}

/* ---------- Классика ---------- */
function allCocktails(){
  const out=[]; S.forEach(s=>(s.sections||[]).forEach(sec=>sec.blocks.forEach(b=>{ if(b.type==="cocktails") b.items.forEach(c=>out.push({s,c})); }))); return out;
}
let ckFilter = "all";
function cocktails(){
  topbar("Классика", "Коктейли из докладов", false); setNav("cocktails");
  const all = allCocktails(), bases = S.filter(s=>all.some(x=>x.s===s));
  const list = all.filter(x=>ckFilter==="all"||x.s.id===ckFilter);
  $view.innerHTML = `<div class="sp-head"><span class="eyebrow">Классика</span><h1>Коктейли</h1><p>${all.length} классических рецептов по базовому спирту.</p></div>
  <div class="filters">${[["all","Все"],...bases.map(s=>[s.id,s.name])].map(f=>`<button class="tab" type="button" data-ck="${esc(f[0])}" aria-selected="${ckFilter===f[0]}">${esc(f[1])}</button>`).join("")}</div>
  <div class="cards">${list.map(x=>cocktail(x.c, x.s.name)).join("")}</div>`;
}

/* ---------- Меню бара ---------- */
const ABV = ["Крепость"], META = ["Производитель","Регион"];
function itemHTML(it, gi, ii){
  const chips = it.chips||[], long = it.long||[], tags = it.tags||[];
  const abv = chips.find(c=>ABV.includes(c[0])), meta = chips.find(c=>META.includes(c[0]));
  const specs = chips.filter(c=>!ABV.includes(c[0]) && !META.includes(c[0]));
  const hasBody = specs.length || long.length || it.img || A.on;
  return `<details class="item" id="it-${gi}-${ii}"><summary><div class="it-row">
    ${it.img?`<img class="it-thumb" src="${esc(src(it.img))}" alt="" loading="lazy">`:""}
    <div class="it-main"><div class="it-top"><b>${esc(it.name)}</b>${abv?`<span class="abv">${esc(abv[1])}</span>`:""}</div>
    ${it.alt?`<span class="alt">${esc(it.alt)}</span>`:""}${meta?`<span class="maker">${esc(meta[1])}</span>`:""}
    ${tags.length?`<div class="tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
    ${hasBody?`<span class="more">Подробнее</span>`:""}</div></div>
  </summary>${hasBody?`<div class="it-body">
    ${A.on?`<div class="item-admin"><button type="button" data-act="editItem" data-a="${gi}" data-b="${ii}">Изменить</button><button type="button" data-act="moveItem" data-a="${gi}" data-b="${ii}" data-c="-1" aria-label="Выше">↑</button><button type="button" data-act="moveItem" data-a="${gi}" data-b="${ii}" data-c="1" aria-label="Ниже">↓</button></div>`:""}
    ${it.img?`<img class="it-img" src="${esc(src(it.img))}" alt="${esc(it.name)}" loading="lazy">`:""}
    ${specs.length?`<div class="specs">${specs.map(c=>`<div class="spec"><span>${esc(c[0])}</span><b>${esc(c[1])}</b></div>`).join("")}</div>`:""}
    ${long.map(f=>`<div class="fld"><span>${esc(f[0])}</span><p>${esc(f[1])}</p></div>`).join("")}
  </div>`:""}</details>`;
}
function menu(sid, gi, ii){
  const sh = M.find(x=>x.id===sid) || M[0];
  topbar("Меню бара", sh ? sh.title : "", false); setNav("menu");
  ctx = { sh };
  if(!sh){ $view.innerHTML = `<div class="sp-head"><h1>Меню бара</h1><p>Пока пусто.</p></div>${A.on?`<div class="add-row"><button type="button" data-act="addMenuTab">＋ Вкладка меню</button></div>`:""}`; return; }
  $view.innerHTML = `<div class="sp-head"><span class="eyebrow">Ассортимент «Подушки»</span><h1>Меню бара</h1><p>Нажмите на позицию, чтобы открыть состав, приготовление и описание.</p></div>
  <div class="tabs" role="tablist">${M.map(x=>`<button class="tab" role="tab" type="button" aria-selected="${x===sh}" data-menu="${esc(x.id)}">${esc(x.title)}</button>`).join("")}${A.on?`<button class="tab tab-add" type="button" data-act="addMenuTab">＋ Вкладка</button>`:""}</div>
  ${A.on?`<div class="astrip"><button type="button" data-act="renameMenuTab">Переименовать вкладку</button><button type="button" data-act="moveMenuTab" data-a="-1">← Влево</button><button type="button" data-act="moveMenuTab" data-a="1">Вправо →</button><button type="button" data-act="deleteMenuTab">Удалить вкладку</button><button type="button" data-act="addGroup">＋ Категория</button></div>`:""}
  ${sh.groups.length>1?`<div class="jump">${sh.groups.map((g,i)=>`<button type="button" data-jump="${i}">${esc(g.title)}</button>`).join("")}</div>`:""}
  ${sh.groups.map((g,i)=>`<section class="grp" id="grp-${i}"><h2>${esc(g.title)}<small>${g.items.length}</small></h2>
    ${A.on?`<div class="grp-admin"><button type="button" data-act="addItem" data-a="${i}">＋ Позиция</button><button type="button" data-act="renameGroup" data-a="${i}">Переименовать</button><button type="button" data-act="moveGroup" data-a="${i}" data-b="-1">↑</button><button type="button" data-act="moveGroup" data-a="${i}" data-b="1">↓</button><button type="button" data-act="deleteGroup" data-a="${i}">Удалить категорию</button></div>`:""}
    ${g.items.map((it,j)=>itemHTML(it,i,j)).join("")}</section>`).join("")}`;
  const t = $view.querySelector('.tab[aria-selected="true"]'); t && t.scrollIntoView({inline:"center",block:"nearest"});
  if (gi!==undefined && ii!==undefined) setTimeout(()=>{ const el=document.getElementById(`it-${gi}-${ii}`); if(el){ el.open=true; el.scrollIntoView({block:"start"}); } }, 30);
}

/* ---------- ТТК ---------- */
function ttkItem(it, gi, ii){
  const info = it.info || [];
  return `<details class="item" id="tt-${gi}-${ii}"><summary><div class="it-row">${it.img?`<img class="it-thumb" src="${esc(src(it.img))}" alt="" loading="lazy">`:""}<div class="it-main">

    <span class="more">Техкарта</span></div></div></summary>
  <div class="it-body">
    ${A.on?`<div class="item-admin"><button type="button" data-act="editTtk" data-a="${gi}" data-b="${ii}">Изменить</button><button type="button" data-act="moveTtk" data-a="${gi}" data-b="${ii}" data-c="-1" aria-label="Выше">↑</button><button type="button" data-act="moveTtk" data-a="${gi}" data-b="${ii}" data-c="1" aria-label="Ниже">↓</button></div>`:""}

  </div></details>`;

function ttk(sid, gi, ii){
  const sh = TT().find(x=>x.id===sid) || TT()[0];

/* ---------- Калькулятор заготовок ---------- */
const parseNum = s => { const n = parseFloat(String(s).replace(/\s/g,"").replace(",", ".")); return isFinite(n) ? n : NaN; };
const fmt = n => { if (!isFinite(n)) return "—"; const r = Math.round(n * 10) / 10; return r.toLocaleString("ru-RU", { minimumFractionDigits: r % 1 ? 1 : 0, maximumFractionDigits: 1 }); };
const fmtK = k => (Math.round(k * 1000) / 1000).toLocaleString("ru-RU", { maximumFractionDigits: 3 });
const SUMMABLE = u => u === "г" || u === "мл";
const baseSum = r => r.ing.reduce((s, i) => s + (i.q != null && SUMMABLE(i.u) ? i.q : 0), 0);
const mainUnit = r => { const g = r.ing.filter(i=>i.u==="г").length, m = r.ing.filter(i=>i.u==="мл").length; return m > g ? "мл" : "г"; };
const stdK = r => r.coef || r.batch || null;
const lsx = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; };

  $view.innerHTML = `<section class="sp-head"><span class="eyebrow">Калькулятор</span><h1>Заготовки</h1><p>Выберите заготовку или премикс — пересчитаем граммовки под объём, остаток или количество порций.</p></section>
    <button class="sj-cta" type="button" data-go="sj"><b>Суперджус</b><span>Пересчёт по весу цедры — метод Кевина Коса: кислоты и вода под вашу цедру</span></button>

    ${A.on && ccat!=="Все"?`<div class="astrip"><button type="button" data-act="renamePrepCat">Переименовать раздел</button><button type="button" data-act="movePrepCat" data-a="-1">← Влево</button><button type="button" data-act="movePrepCat" data-a="1">Вправо →</button><button type="button" data-act="deletePrepCat">Удалить раздел</button></div>`:""}
    ${A.on?`<div class="add-row" style="margin-top:4px"><button type="button" data-act="addPrep">＋ Заготовка</button><button type="button" data-act="addPrepCat">＋ Раздел</button></div>`:""}
    <div id="cres"></div>`;

function drawCalcList(){

const CMODES = [["k","×","коэфф."],["out","Выход","г / мл"],["have","Остаток","ингредиент"],["port","Порции","на смену"]];

function calcPanel(){

function calcK(){
  const r = PR()[cst.i], sum = baseSum(r);
  if (cst.mode === "k") { const k = parseNum(cst.k); return k > 0 ? { k } : { err: "Введите коэффициент больше нуля." }; }
  if (cst.mode === "out") { const o = parseNum(cst.out); if (!(o > 0)) return { err: "Введите, сколько нужно на выходе." }; if (!sum) return { err: "В этой ТТК нет ингредиентов в граммах или миллилитрах." }; return { k: o / sum }; }
  if (cst.mode === "have") { const ing = r.ing[cst.haveIdx], h = parseNum(cst.have); if (!(h > 0)) return { err: "Введите, сколько этого ингредиента есть по факту." }; return { k: h / ing.q, pin: cst.haveIdx }; }
  const n = parseNum(cst.port), ps = parseNum(cst.portSize);
  if (!(n > 0)) return { err: "Введите количество порций." };
  if (!(ps > 0)) return { err: "Укажите размер одной порции." };
  if (!sum) return { err: "В этой ТТК нет ингредиентов в граммах или миллилитрах." };
  const ref = r.portion && Math.abs(sum - r.portion[0]) / r.portion[0] < 0.2 ? r.portion[0] : sum;
  return { k: n * ps / ref, portions: n };
}

function buildIndex(){

    if(b.items)b.items.forEach(i=>parts.push(Array.isArray(i)?i.flat().join(" — "):i));

  })));
  M.forEach(sh=>sh.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const t=[it.name,it.alt,...(it.chips||[]).map(c=>c[1]),(it.tags||[]).join(", "),...(it.long||[]).map(f=>f[1])].filter(Boolean).join(" — ");
    index.push({m:`${sh.id}-${gi}-${ii}`, where:`Меню · ${sh.title} · ${g.title}`, title:it.name, t});

  GL().forEach((x,i)=>index.push({gl:i, where:"Словарь · "+x[2], title:x[0], t:[x[0],x[1],x[3]].join(" — ")}));
  TT().forEach(sh=>sh.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{

function guessRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m[1] + "/" + (seg && !/\.html?$/.test(seg) ? seg : m[1] + ".github.io");
}

/* --- GitHub API --- */
async function gh(method, path, body){
  const r = await fetch(`https://api.github.com/repos/${A.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`, {
    method, headers: { "Authorization": "Bearer " + A.token, "Accept": "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status===404 && method==="GET") return null;
  if(!r.ok){
    const e = new Error("GitHub " + r.status); e.status = r.status;
    try { e.detail = (await r.json()).message; } catch(x){}
    throw e;
  }
  return r.json();
}
function b64utf8(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function fromB64utf8(b64){
  const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghError(e){
  if(e.status===401) return "Токен не подходит или истёк. Создайте новый на GitHub.";
  if(e.status===403) return "У токена нет права на запись в этот репозиторий.";
  if(e.status===404) return "Репозиторий не найден. Проверьте название: владелец/репозиторий.";
  if(e.status===409 || e.status===422) return "Данные изменились с другого устройства. Выйдите и войдите снова, затем повторите правку.";
  if(!e.status) return "Нет связи с GitHub. Проверьте интернет и повторите.";
  return "GitHub ответил ошибкой " + e.status + (e.detail ? ": " + e.detail : "");
}

async function login(token, repo){
  A.token = token; A.repo = repo;
  const r = await fetch(`https://api.github.com/repos/${repo}`, { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } });
  if(!r.ok){ const e = new Error(); e.status = r.status; throw e; }
  const info = await r.json();
  if(info.permissions && !info.permissions.push){ const e = new Error(); e.status = 403; throw e; }
  const f = await gh("GET", "content.json");          // свежая версия прямо из репозитория
  if(f){ A.sha = f.sha; try { setDB(JSON.parse(fromB64utf8(f.content))); } catch(x){} }
  else A.sha = null;
  A.on = true; A.dirty = false; A.pending = {}; A.snapshot = JSON.stringify(DB);
  savedToken = token; store.set("gh_token", token); store.set("gh_repo", repo);
  document.body.classList.add("admin");
  updateBar(); route(true);
}
function logout(force){
  if(A.dirty && !force){ confirmSheet("Есть несохранённые правки", "Если выйти сейчас, они пропадут.", "Выйти без сохранения", ()=>logout(true)); return; }
  if(A.dirty){ // откатываем несохранённое
    A.dirty=false; A.pending={}; try { setDB(JSON.parse(A.snapshot)); } catch(e){}
  }
  A.on=false; document.body.classList.remove("admin"); updateBar(); route(true);
}
function forget(){ savedToken=""; store.del("gh_token"); store.del("gh_repo"); }

function markDirty(){
  A.dirty = true; buildIndex(); updateBar();
  try { tg && tg.enableClosingConfirmation(); } catch(e){}
}
function updateBar(){
  const bar = document.getElementById("abar"); bar.hidden = !A.on;
  const n = Object.keys(A.pending).length;
  document.getElementById("ab-t").textContent = A.saving ? "Сохраняю…" : A.dirty ? `Есть несохранённые правки${n?` · фото: ${n}`:""}` : "Режим редактирования · всё сохранено";
  const b = document.getElementById("ab-save"); b.disabled = !A.dirty || A.saving;
  if(!A.dirty) try { tg && tg.disableClosingConfirmation(); } catch(e){}
}
window.addEventListener("beforeunload", e=>{ if(A.dirty){ e.preventDefault(); e.returnValue=""; } });

async function save(){
  if(A.saving || !A.dirty) return;
  A.saving = true; updateBar();
  try {
    const json = JSON.stringify(DB, null, 1);
    for(const [path, b64] of Object.entries(A.pending)){
      if(json.includes(path)) await gh("PUT", path, { message: "Фото " + path, content: b64 });
      delete A.pending[path];
    }
    const body = { message: "Правки из приложения" + (tgUser ? " — " + (tgUser.first_name||"") : ""), content: b64utf8(json) };
    if(A.sha) body.sha = A.sha;
    const r = await gh("PUT", "content.json", body);
    A.sha = r.content.sha; A.dirty = false; A.snapshot = json;
    toast("Сохранено. У сотрудников обновится через 1–2 минуты.", 4000);
  } catch(e){
    toast(ghError(e), 6000);
  }
  A.saving = false; updateBar();
}

/* --- Фото: сжатие на телефоне перед загрузкой --- */
function readImage(file, max){
  max = max || 1280;
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg", 0.82);
      res({ dataUrl, b64: dataUrl.split(",")[1] });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Не удалось открыть фото. Попробуйте JPG или PNG.")); };
    img.src = url;
  });
}
function addPending(photo, hint){
  const slug = (hint||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30);
  const path = "img/" + (slug ? slug + "-" : "") + Date.now().toString(36) + ".jpg";
  A.pending[path] = photo.b64; shown[path] = photo.dataUrl; return path;
}
function photoField(cur){
  return `<div class="photo-pick" data-photo>
    <img src="${cur?esc(src(cur)):""}" alt="" ${cur?"":"hidden"}>
    <div class="pp-btns"><label>${cur?"Заменить фото":"Выбрать фото"}<input type="file" accept="image/*"></label>${cur?`<button type="button" data-rm-photo>Убрать фото</button>`:""}</div>
    <p class="err" hidden></p></div>`;
}
function wirePhoto(root, state){
  const box = root.querySelector("[data-photo]"); if(!box) return;
  const img = box.querySelector("img"), err = box.querySelector(".err");
  box.querySelector("input[type=file]").addEventListener("change", async ev=>{
    const f = ev.target.files[0]; if(!f) return;
    err.hidden = true;
    try { state.photo = await readImage(f); state.removed = false; img.src = state.photo.dataUrl; img.hidden = false; }
    catch(e){ err.textContent = e.message; err.hidden = false; }
  });
  const rm = box.querySelector("[data-rm-photo]");
  if(rm) rm.addEventListener("click", ()=>{ state.photo = null; state.removed = true; img.hidden = true; });
}
function applyPhoto(state, current, hint){
  if(state.photo) return addPending(state.photo, hint);
  if(state.removed) return "";
  return current || "";
}

/* --- Окно редактирования --- */
function openSheet({ title, body, saveText, onSave, onDelete, deleteText, onOpen }){
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3>${body}
    <p class="err" data-err hidden></p>
    <div class="row">${onDelete?`<button type="button" class="btn-del" data-del>${esc(deleteText||"Удалить")}</button>`:""}<button type="button" class="btn-ghost" data-cancel>Отмена</button><button type="submit" class="btn-main">${esc(saveText||"Готово")}</button></div>
  </form>`;
  document.body.appendChild(bg);
  const form = bg.querySelector("form"), errEl = form.querySelector("[data-err]");
  const close = ()=>bg.remove();
  const fail = msg=>{ errEl.textContent = msg; errEl.hidden = false; };
  bg.addEventListener("click", e=>{ if(e.target===bg) close(); });
  form.querySelector("[data-cancel]").addEventListener("click", close);
  const del = form.querySelector("[data-del]");
  if(del) del.addEventListener("click", ()=>{
    if(!del.classList.contains("sure")){ del.classList.add("sure"); del.textContent = "Точно удалить?"; return; }
    onDelete(); close();
  });
  form.addEventListener("submit", async e=>{
    e.preventDefault(); errEl.hidden = true;
    const btn = form.querySelector(".btn-main"); btn.disabled = true;
    try { const r = await onSave(form, fail); if(r !== false) close(); }
    finally { btn.disabled = false; }
  });
  if(onOpen) onOpen(form);
  const first = form.querySelector("input:not([type=file]),textarea,select"); if(first) setTimeout(()=>first.focus(), 50);
  return form;
}
function confirmSheet(title, text, yes, fn){
  openSheet({ title, body:`<p class="hint">${esc(text)}</p>`, saveText: yes, onSave: ()=>{ fn(); } });
}
const val = (form, name) => (form.querySelector(`[name="${name}"]`)||{}).value || "";

      <label>Токен GitHub<input name="token" type="password" autocomplete="off" value="${esc(token)}" placeholder="github_pat_…"></label>

/* --- Редактор блоков --- */
const BT = [["p","Абзац"],["lead","Крупный вводный абзац"],["h","Подзаголовок"],["note","Важно (рамка)"],["list","Список"],["olist","Нумерованный список"],["steps","Шаги"],["timeline","Таймлайн"],["cards","Карточки"],["table","Таблица"],["cocktails","Коктейли"],["quiz","Вопрос с ответом"],["picker","Примеры с ролями"],["photo","Фото"]];
const HINT = {
  p:"Обычный текст.", lead:"Крупный текст для начала вкладки.", h:"Короткий заголовок внутри вкладки.", note:"Текст в оранжевой рамке «Важно».",
  list:"Каждый пункт с новой строки.", olist:"Каждый пункт с новой строки, номера проставятся сами.",
  steps:"Каждый шаг с новой строки: <code>Заголовок | текст</code>",
  timeline:"Каждое событие с новой строки: <code>Дата | что произошло</code>",
  cards:"Каждая карточка с новой строки: <code>Название | метка | текст</code>. Метку можно оставить пустой.",
  table:"Первая строка — заголовки колонок, дальше строки. Колонки разделяйте знаком <code>|</code>",
  cocktails:"Каждый коктейль с новой строки: <code>Название | описание | ингредиенты через ; | как готовить</code>",
  picker:"Каждый напиток с новой строки: <code>Название | ap, dg или both | текст | что есть в нашем баре</code>. ap — аперитив, dg — дижестив, both — обе роли.",
  quiz:"Вопрос и ответ. Ответ откроется по кнопке.", photo:"Фото с подписью. Оно сожмётся автоматически."
};
const cells = line => line.split("|").map(x=>x.trim());
const lines = t => t.split("\n").map(x=>x.trim()).filter(Boolean);
function toText(b){
  switch(b.type){
    case "lead": case "p": case "h": case "note": return b.text||"";
    case "list": case "olist": return (b.items||[]).join("\n");
    case "steps": case "timeline": case "cards": case "picker": return (b.items||[]).map(x=>x.join(" | ")).join("\n");
    case "table": return [(b.head||[]).join(" | "), ...(b.rows||[]).map(r=>r.join(" | "))].join("\n");
    case "cocktails": return (b.items||[]).map(c=>[c[0],c[1],(c[2]||[]).join("; "),c[3]||""].join(" | ").replace(/( \| )+$/,"")).join("\n");
  }
  return "";
}
function fromText(type, t){
  switch(type){
    case "lead": case "p": case "h": case "note": return { type, text: t.trim() };
    case "list": case "olist": return { type, items: lines(t) };
    case "steps": case "timeline": return { type, items: lines(t).map(l=>{ const c=cells(l); return [c[0], c.slice(1).join(" | ")]; }) };
    case "cards": return { type, items: lines(t).map(l=>{ const c=cells(l); return c.length<3 ? [c[0], "", c[1]||""] : [c[0], c[1], c.slice(2).join(" | ")]; }) };
    case "picker": return { type, items: lines(t).map(l=>{ const c=cells(l); const r=(c[1]||"").toLowerCase(); return [c[0], ["ap","dg","both"].includes(r)?r:"both", c[2]||"", c[3]||""]; }) };
    case "table": { const L = lines(t); const w = L.length ? cells(L[0]).length : 0; return { type, head: L.length?cells(L[0]):[], rows: L.slice(1).map(l=>{ const c=cells(l); while(c.length<w) c.push(""); return c; }) }; }
    case "cocktails": return { type, items: lines(t).map(l=>{ const c=cells(l); return [c[0], c[1]||"", (c[2]||"").split(";").map(x=>x.trim()).filter(Boolean), c[3]||""]; }) };
  }
  return { type };
}
function blockFields(type, b){
  if(type==="quiz") return `<label>Вопрос<textarea name="q" style="min-height:80px">${esc(b.q||"")}</textarea></label><label>Ответ<textarea name="a" style="min-height:80px">${esc(b.a||"")}</textarea></label>`;
  if(type==="photo") return photoField(b.src) + `<label>Подпись<input name="caption" value="${esc(b.caption||"")}"></label>`;
  return `<label>Текст<textarea name="text" spellcheck="true">${esc(b.type===type ? toText(b) : (b.__text||""))}</textarea></label>`;
}
function editBlock(i, isNew, presetType){
  const sec = ctx.cur; if(!sec) return;
  const b = isNew ? { type: presetType||"p" } : sec.blocks[i];
  const state = {};
  openSheet({
    title: isNew ? "Новый блок" : "Изменить блок",
    body: `<label>Вид блока<select name="type">${BT.map(t=>`<option value="${t[0]}" ${t[0]===b.type?"selected":""}>${t[1]}</option>`).join("")}</select></label>
      <p class="hint" data-hint>${HINT[b.type]||""}</p><div data-fields>${blockFields(b.type, b)}</div>`,
    saveText: isNew ? "Добавить" : "Готово",
    onDelete: isNew ? null : ()=>{ sec.blocks.splice(i,1); markDirty(); route(true); },
    deleteText: "Удалить блок",
    onOpen: form=>{
      wirePhoto(form, state);
      form.querySelector('[name="type"]').addEventListener("change", e=>{
        const ty = e.target.value, ta = form.querySelector('[name="text"]');
        const keep = { type: "__", __text: ta ? ta.value : "", src: b.src, caption: b.caption, q: b.q, a: b.a };
        form.querySelector("[data-fields]").innerHTML = blockFields(ty, keep);
        form.querySelector("[data-hint]").innerHTML = HINT[ty]||"";
        wirePhoto(form, state);
      });
    },
    onSave: (form, fail)=>{
      const ty = val(form,"type"); let nb;
      if(ty==="quiz"){ nb = { type: ty, q: val(form,"q").trim(), a: val(form,"a").trim() }; if(!nb.q){ fail("Напишите вопрос."); return false; } }
      else if(ty==="photo"){ nb = { type: ty, src: applyPhoto(state, b.src, ctx.s.name), caption: val(form,"caption").trim() }; if(!nb.src){ fail("Выберите фото."); return false; } }
      else {
        const t = val(form,"text"); if(!t.trim()){ fail("Блок пустой — напишите текст."); return false; }
        nb = fromText(ty, t);
        if(ty==="table" && nb.head.length<1){ fail("В таблице нужна строка заголовков."); return false; }
      }
      if(isNew) sec.blocks.splice(i, 0, nb); else sec.blocks[i] = nb;
      markDirty(); route(true);
    }
  });
}

/* --- Меню бара --- */
function editItem(gi, ii, isNew){
  const sh = ctx.sh, g = sh.groups[gi];
  const it = isNew ? { name:"", chips:[], tags:[], long:[] } : g.items[ii];
  const state = {};
  const pair = (l,t)=>`<div class="fpair"><div class="fp-h"><input data-fl value="${esc(l)}" placeholder="Название поля, например Состав"><button type="button" data-rmf aria-label="Удалить поле">✕</button></div><textarea data-ft style="min-height:90px">${esc(t)}</textarea></div>`;
  openSheet({
    title: isNew ? "Новая позиция · " + g.title : "Изменить позицию",
    body: `<label>Название<input name="name" value="${esc(it.name)}"></label>
      <label>Второе название<input name="alt" value="${esc(it.alt||"")}" placeholder="Например, по-русски"></label>
      <label style="margin-bottom:-4px">Фото</label>${photoField(it.img)}
      <label>Вкусовой профиль<input name="tags" value="${esc((it.tags||[]).join(", "))}" placeholder="Цитрусовый, Горький"></label>
      <label>Характеристики<textarea name="chips" style="min-height:100px" placeholder="Крепость: 40%&#10;Производитель: Италия">${esc((it.chips||[]).map(c=>c[0]+": "+c[1]).join("\n"))}</textarea></label>
      <p class="hint">По одной в строке: <code>Метка: значение</code>. «Крепость» и «Производитель» показываются прямо в карточке.</p>
      <div data-pairs style="display:grid;gap:8px">${(it.long||[]).map(f=>pair(f[0],f[1])).join("")}</div>
      <div class="add-row"><button type="button" data-addf>＋ Поле с текстом</button></div>`,
    saveText: isNew ? "Добавить" : "Готово",
    onDelete: isNew ? null : ()=>{ g.items.splice(ii,1); markDirty(); route(true); },
    deleteText: "Удалить позицию",
    onOpen: form=>{
      wirePhoto(form, state);
      const box = form.querySelector("[data-pairs]");
      form.querySelector("[data-addf]").addEventListener("click", ()=>{ box.insertAdjacentHTML("beforeend", pair("","")); box.lastElementChild.querySelector("input").focus(); });
      box.addEventListener("click", e=>{ if(e.target.closest("[data-rmf]")) e.target.closest(".fpair").remove(); });
    },
    onSave: (form, fail)=>{
      const name = val(form,"name").trim(); if(!name){ fail("Напишите название."); return false; }
      const n = isNew ? {} : it;
      n.name = name;
      const alt = val(form,"alt").trim(); if(alt) n.alt = alt; else delete n.alt;
      n.tags = val(form,"tags").split(",").map(x=>x.trim()).filter(Boolean);
      n.chips = lines(val(form,"chips")).map(l=>{ const k=l.indexOf(":"); return k<0?["",l]:[l.slice(0,k).trim(), l.slice(k+1).trim()]; });
      n.long = [...form.querySelectorAll(".fpair")].map(p=>[p.querySelector("[data-fl]").value.trim(), p.querySelector("[data-ft]").value.trim()]).filter(f=>f[1]);
      const img = applyPhoto(state, it.img, name); if(img) n.img = img; else delete n.img;
      if(isNew){ g.items.push(n); markDirty(); route(true); setTimeout(()=>{ const el=document.getElementById(`it-${gi}-${g.items.length-1}`); if(el){ el.open=true; el.scrollIntoView({block:"center"}); } }, 40); }
      else { markDirty(); route(true); const el=document.getElementById(`it-${gi}-${ii}`); if(el) el.open=true; }
    }
  });
}
function nameSheet(title, current, placeholder, apply){
  openSheet({ title, body:`<label>Название<input name="t" value="${esc(current||"")}" placeholder="${esc(placeholder||"")}"></label>`,
    saveText: current ? "Готово" : "Добавить",
    onSave: (form, fail)=>{ const t = val(form,"t").trim(); if(!t){ fail("Напишите название."); return false; } apply(t); markDirty(); }
  });
}
const move = (arr, i, d) => { const j = i + d; if(j<0 || j>=arr.length) return false; const [x] = arr.splice(i,1); arr.splice(j,0,x); return true; };

/* --- Обработчики кнопок администратора --- */
const ACT = {
  gear: ()=>openGear(),
  save: ()=>save(),
  logout: ()=>logout(),
  addSpirit: ()=>editSpirit(null),
  addTerm: ()=>editTerm(null),
  addTtk: el=>editTtk(Number(el.dataset.a), 0, true),
  editTtk: el=>editTtk(Number(el.dataset.a), Number(el.dataset.b), false),
  moveTtk: el=>{ const sh=own("ttk").find(x=>x.id===ctx.tt.id), g=sh.groups[Number(el.dataset.a)], i=Number(el.dataset.b), d=Number(el.dataset.c); if(move(g.items, i, d)){ markDirty(); route(true); const n=document.getElementById(`tt-${el.dataset.a}-${i+d}`); if(n){ n.open=true; n.scrollIntoView({block:"center"}); } } },
  addTtkTab: ()=>nameSheet("Новая вкладка ТТК", "", "Например: Зима", t=>{ const n={ id: uid("tt"), title: t, groups: [{ title: "", items: [] }] }; own("ttk").push(n); setTimeout(()=>go("t-"+n.id)); }),
  renameTtkTab: ()=>{ const sh=own("ttk").find(x=>x.id===ctx.tt.id); nameSheet("Переименовать вкладку", sh.title, "", t=>{ sh.title=t; route(true); }); },
  moveTtkTab: el=>{ const L=own("ttk"), sh=L.find(x=>x.id===ctx.tt.id); if(move(L, L.indexOf(sh), Number(el.dataset.a))){ markDirty(); route(true); } },
  deleteTtkTab: ()=>{ const L=own("ttk"), sh=L.find(x=>x.id===ctx.tt.id); confirmSheet("Удалить вкладку «"+sh.title+"»?", "Удалятся все позиции в ней: "+sh.groups.reduce((k,g)=>k+g.items.length,0)+".", "Удалить", ()=>{ L.splice(L.indexOf(sh),1); markDirty(); go("ttk"); }); },
  addPrep: ()=>editPrep(null),
  addPrepCat: ()=>nameSheet("Новый раздел заготовок", "", "Например: Кордиалы", t=>{ const L=PCATS(); if(!L.includes(t)) L.push(t); DB.prepCats=L; ccat=t; lsx("calc_cat", t); route(true); }),
  renamePrepCat: ()=>{ const old=ccat; nameSheet("Переименовать раздел", old, "", t=>{ const L=PCATS(); if(t!==old && L.includes(t)){ toast("Раздел «"+t+"» уже есть"); return; } own("preps").forEach(p=>{ if(p.cat===old) p.cat=t; }); L[L.indexOf(old)]=t; DB.prepCats=L; ccat=t; lsx("calc_cat", t); route(true); }); },
  movePrepCat: el=>{ const L=PCATS(); if(move(L, L.indexOf(ccat), Number(el.dataset.a))){ DB.prepCats=L; markDirty(); route(true); } },
  deletePrepCat: ()=>{ const c=ccat, n=PR().filter(p=>p.cat===c).length; confirmSheet("Удалить раздел «"+c+"»?", n ? "Вместе с ним удалятся заготовки в нём: "+n+". Чтобы сохранить заготовку, сначала перенесите её в другой раздел через «Изменить заготовку»." : "Раздел пустой.", "Удалить", ()=>{ const P=own("preps"); for(let k=P.length-1;k>=0;k--) if(P[k].cat===c) P.splice(k,1); DB.prepCats=PCATS().filter(x=>x!==c); ccat="Все"; lsx("calc_cat", ccat); markDirty(); route(true); }); },
  editPrep: el=>editPrep(Number(el.dataset.a)),
  editTerm: el=>editTerm(Number(el.dataset.a)),
  editSpirit: el=>editSpirit(el.dataset.a),
  addSection: ()=>editSection(true),
  renameSection: ()=>editSection(false),
  moveSection: el=>{ const s=ctx.s; if(move(s.sections, s.sections.indexOf(ctx.cur), Number(el.dataset.a))){ markDirty(); route(true); } },
  deleteSection: ()=>{ const s=ctx.s, sec=ctx.cur; confirmSheet("Удалить вкладку «"+sec.title+"»?", "Вместе с ней удалится всё её содержимое.", "Удалить", ()=>{ s.sections.splice(s.sections.indexOf(sec),1); markDirty(); go("s-"+s.id); }); },
  addBlock: ()=>editBlock(ctx.cur.blocks.length, true, "p"),
  addPhoto: ()=>editBlock(ctx.cur.blocks.length, true, "photo"),
  editBlock: el=>editBlock(Number(el.dataset.a), false),
  moveBlock: el=>{ if(move(ctx.cur.blocks, Number(el.dataset.a), Number(el.dataset.b))){ markDirty(); route(true); } },
  addMenuTab: ()=>nameSheet("Новая вкладка меню", "", "Например: Ликёры", t=>{ const n={ id: uid("m"), title: t, groups: [{ title: t, items: [] }] }; M.push(n); setTimeout(()=>go("m-"+n.id)); }),
  renameMenuTab: ()=>nameSheet("Переименовать вкладку", ctx.sh.title, "", t=>{ ctx.sh.title=t; route(true); }),
  moveMenuTab: el=>{ if(move(M, M.indexOf(ctx.sh), Number(el.dataset.a))){ markDirty(); route(true); } },
  deleteMenuTab: ()=>{ const sh=ctx.sh; confirmSheet("Удалить вкладку «"+sh.title+"»?", "Удалятся все её категории и позиции.", "Удалить", ()=>{ M.splice(M.indexOf(sh),1); markDirty(); go("menu"); }); },
  addGroup: ()=>nameSheet("Новая категория", "", "Например: Настойки", t=>{ ctx.sh.groups.push({ title: t, items: [] }); route(true); }),
  renameGroup: el=>{ const g=ctx.sh.groups[Number(el.dataset.a)]; nameSheet("Переименовать категорию", g.title, "", t=>{ g.title=t; route(true); }); },
  moveGroup: el=>{ if(move(ctx.sh.groups, Number(el.dataset.a), Number(el.dataset.b))){ markDirty(); route(true); } },
  deleteGroup: el=>{ const gs=ctx.sh.groups, i=Number(el.dataset.a); confirmSheet("Удалить категорию «"+gs[i].title+"»?", "Удалятся все позиции в ней: "+gs[i].items.length+".", "Удалить", ()=>{ gs.splice(i,1); markDirty(); route(true); }); },
  addItem: el=>editItem(Number(el.dataset.a), 0, true),
  editItem: el=>editItem(Number(el.dataset.a), Number(el.dataset.b), false),
  moveItem: el=>{ const g=ctx.sh.groups[Number(el.dataset.a)], i=Number(el.dataset.b); if(move(g.items, i, Number(el.dataset.c))){ markDirty(); route(true); const n=document.getElementById(`it-${el.dataset.a}-${i+Number(el.dataset.c)}`); if(n){ n.open=true; n.scrollIntoView({block:"center"}); } } }
};

/* ---------- Нажатия ---------- */
let wordTaps = [];
document.addEventListener("click", e=>{
  if(e.target.closest(".sheet-bg")) return;
  if(e.target.closest("[data-word]")){ const now=Date.now(); wordTaps=wordTaps.filter(t=>now-t<2500); wordTaps.push(now); if(wordTaps.length>=5){ wordTaps=[]; openGear(); } return; }
  const el = e.target.closest("button"); if(!el) return;
  if(el.dataset.act && ACT[el.dataset.act]){ e.preventDefault(); haptic(); ACT[el.dataset.act](el); return; }
  if(el.dataset.pick!==undefined){ const box=el.closest(".picker"); box.querySelectorAll(".pk").forEach(b=>b.setAttribute("aria-pressed", b===el)); box.querySelectorAll(".pk-card").forEach(c=>c.hidden=c.dataset.card!==el.dataset.pick); const card=box.querySelector(`.pk-card[data-card="${el.dataset.pick}"]`); card&&card.scrollIntoView({block:"nearest",behavior:"smooth"}); haptic(); return; }
  if(el.dataset.reveal!==undefined){ el.nextElementSibling.hidden=false; el.hidden=true; haptic(); return; }
  if(el.dataset.back!==undefined){ goBack(); return; }
  if(el.dataset.jump!==undefined){ const g=document.getElementById("grp-"+el.dataset.jump); g&&g.scrollIntoView({block:"start",behavior:"smooth"}); haptic(); return; }
  if(el.dataset.menu){ go("m-"+el.dataset.menu); return; }
  if(el.dataset.mi){ go("m-"+el.dataset.mi); return; }
  if(el.dataset.ti){ go("t-"+el.dataset.ti); return; }
  if(el.dataset.rec!==undefined){ go("c-"+el.dataset.rec); return; }
  if(el.dataset.ccat!==undefined){ haptic(); ccat=el.dataset.ccat; lsx("calc_cat", ccat); if(A.on){ const y=scrollY; route(true); scrollTo(0,y); return; } document.querySelectorAll("[data-ccat]").forEach(x=>x.setAttribute("aria-selected", x===el)); drawCalcList(); return; }
  if(el.dataset.mode){ haptic(); cst.mode=el.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed", x===el)); calcPanel(); calcRun(); return; }
  if(el.dataset.set){ haptic(); cst[el.dataset.set]=String(el.dataset.v).replace(".", ","); calcPanel(); calcRun(); return; }
  if(el.dataset.copy!==undefined){ copyLayout(); return; }
  if(el.dataset.gi!==undefined){ gq=""; gcat="Все"; go("g-"+el.dataset.gi); return; }
  if(el.dataset.gcat!==undefined){ haptic(); gcat=el.dataset.gcat; document.querySelectorAll("[data-gcat]").forEach(x=>x.setAttribute("aria-selected", x===el)); drawDict(); return; }
  if(el.dataset.letter!==undefined){ haptic(); const s=document.getElementById("gl-l-"+el.dataset.letter); s&&s.scrollIntoView({block:"start",behavior:"smooth"}); return; }
  if(el.dataset.sjf){ haptic(); sj.fruit=el.dataset.sjf; sj.c=sj.m=sj.w=""; superjuice(); return; }
  if(el.dataset.sjm){ haptic(); sj.mode=el.dataset.sjm; document.querySelectorAll("[data-sjm]").forEach(x=>x.setAttribute("aria-pressed", x===el)); sjPanel(); sjRun(); return; }
  if(el.dataset.sjset){ haptic(); sj[el.dataset.sjset]=el.dataset.v; sjPanel(); sjRun(); return; }
  if(el.dataset.ttk){ go("t-"+el.dataset.ttk); return; }
  if(el.dataset.ck){ ckFilter=el.dataset.ck; haptic(); cocktails(); return; }
  if(el.dataset.spirit){ go("s-"+el.dataset.spirit+(el.dataset.sec?"-"+el.dataset.sec:"")); return; }
  if(el.dataset.go){ go(el.dataset.go==="home"?"":el.dataset.go); }
});

/* ---------- Запуск ---------- */
function reloadContent(){
  return fetch("content.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if(d && d.spirits && !A.on){ setDB(d); route(true); } })
    .catch(()=>{});
}
buildIndex();
route();
reloadContent();
})();
</script>
